---
- name: Validate XP2P client endpoint intents
  ansible.builtin.assert:
    that:
      - xp2p_client_endpoints | length > 0
      - xp2p_client_endpoints | selectattr('tag', 'defined') | list | length == xp2p_client_endpoints | length
      - xp2p_client_endpoints | selectattr('source', 'defined') | list | length == xp2p_client_endpoints | length
      - xp2p_client_endpoints | selectattr('state', 'defined') | list | length == xp2p_client_endpoints | length
      - xp2p_client_endpoints | rejectattr('state', 'in', ['present', 'absent']) | list | length == 0
    fail_msg: "XP2P client endpoint apply requires normalized endpoint intents."

- name: Check xp2p command
  ansible.builtin.raw: command -v xp2p
  register: xp2p_client_endpoint_command
  changed_when: false

- name: Collect current xp2p client endpoints before apply
  ansible.builtin.raw: xp2p client list
  register: xp2p_client_endpoint_list_before
  changed_when: false
  no_log: true

- name: Build XP2P client endpoint apply plan
  ansible.builtin.set_fact:
    xp2p_client_endpoint_apply_plan: >-
      {{
        xp2p_client_endpoints
        | ansible_common.core.xp2p_client_endpoint_apply_plan(xp2p_client_endpoint_list_before.stdout)
      }}
  no_log: true

- name: Reject implicit XP2P client endpoint replacement
  ansible.builtin.assert:
    that:
      - xp2p_client_endpoint_apply_plan.implicit_replacements | length == 0
    fail_msg: >-
      XP2P client endpoint replacement requires explicit replace=true:
      {{ xp2p_client_endpoint_apply_plan.implicit_replacements | join(', ') }}.

- name: Remove model-owned absent XP2P client endpoints
  ansible.builtin.raw: >-
    xp2p client remove '{{ item.tag }}' --quiet
  loop: "{{ xp2p_client_endpoint_apply_plan.absent }}"
  loop_control:
    label: "{{ item.source }} {{ item.tag }}"
  register: xp2p_client_endpoint_absent_remove
  changed_when: xp2p_client_endpoint_absent_remove.rc == 0
  failed_when: false
  no_log: true

- name: Install missing XP2P client endpoints additively
  ansible.builtin.raw: >-
    xp2p client install
    {% if item.link is defined %}-L '{{ item.link }}'
    {% else %}-H '{{ item.host }}' -P '{{ item.port }}' -u '{{ item.user }}' -w '{{ item.password }}' -s '{{ item.sni | default(item.server_name) }}'
    {% endif %}
  loop: "{{ xp2p_client_endpoint_apply_plan.missing }}"
  loop_control:
    label: "{{ item.source }} {{ item.tag }}"
  register: xp2p_client_endpoint_additive_installs
  changed_when: xp2p_client_endpoint_additive_installs.rc == 0
  failed_when: false
  no_log: true

- name: Remove model-owned XP2P client endpoint before explicit replacement
  ansible.builtin.raw: >-
    xp2p client remove '{{ item.tag }}' --quiet
  loop: "{{ xp2p_client_endpoint_apply_plan.replacements }}"
  loop_control:
    label: "{{ item.source }} {{ item.tag }}"
  register: xp2p_client_endpoint_replace_removes
  changed_when: xp2p_client_endpoint_replace_removes.rc == 0
  no_log: true

- name: Reinstall XP2P client endpoint after explicit replacement
  ansible.builtin.raw: >-
    xp2p client install
    {% if item.item.link is defined %}-L '{{ item.item.link }}'
    {% else %}-H '{{ item.item.host }}' -P '{{ item.item.port }}' -u '{{ item.item.user }}' -w '{{ item.item.password }}' -s '{{ item.item.sni | default(item.item.server_name) }}'
    {% endif %}
  loop: "{{ xp2p_client_endpoint_replace_removes.results | default([]) }}"
  loop_control:
    label: "{{ item.item.source }} {{ item.item.tag }}"
  register: xp2p_client_endpoint_reinstalls
  changed_when: xp2p_client_endpoint_reinstalls.rc == 0
  when: item is changed
  no_log: true

- name: Validate XP2P client endpoint apply command results
  ansible.builtin.assert:
    that:
      - >-
        xp2p_client_endpoint_additive_installs.results | default([])
        | selectattr('rc', 'ne', 0)
        | rejectattr('item.tag', 'in', xp2p_client_endpoint_list_before.stdout)
        | list
        | length == 0
    fail_msg: "XP2P client endpoint additive install failed for at least one missing endpoint."

- name: Reconcile XP2P client endpoint health settings
  ansible.builtin.raw: |
    set -eu
    config_path='{{ xp2p_client_endpoints_config_path }}'
    tag='{{ item.tag }}'
    heartbeat_mode='{{ item.heartbeat_mode | default("") }}'
    allow_insecure='{{ (item.allow_insecure | bool | ternary("true", "false")) if item.allow_insecure is defined else "" }}'
    [ -n "$heartbeat_mode" ] || [ -n "$allow_insecure" ] || exit 0
    [ -f "$config_path" ] || exit 0
    tmp_path="${config_path}.health-settings.$$"
    awk -v tag="$tag" -v heartbeat_mode="$heartbeat_mode" -v allow_insecure="$allow_insecure" '
      function set_field(record, name, value) {
        if (value == "") {
          return record
        }
        pattern = name "[[:space:]]*=[[:space:]]*([^,}]+)"
        replacement = name " = " value
        if (record ~ pattern) {
          sub(pattern, replacement, record)
        } else {
          sub(/[[:space:]]*}$/, ", " replacement " }", record)
        }
        return record
      }
      function patch_record(record) {
        if (record ~ "tag = \"" tag "\"") {
          record = set_field(record, "heartbeat_mode", "\"" heartbeat_mode "\"")
          record = set_field(record, "allow_insecure", allow_insecure)
        }
        return record
      }
      {
        rest = $0
        output = ""
        while (match(rest, /\{[^{}]*tag = "[^"]+"[^{}]*\}/)) {
          output = output substr(rest, 1, RSTART - 1) patch_record(substr(rest, RSTART, RLENGTH))
          rest = substr(rest, RSTART + RLENGTH)
        }
        print output rest
      }
    ' "$config_path" > "$tmp_path"
    if cmp -s "$config_path" "$tmp_path"; then
      rm "$tmp_path"
      exit 0
    fi
    cp -a "$config_path" "${config_path}.before-health-settings-$(date +%Y%m%dT%H%M%S)"
    mv "$tmp_path" "$config_path"
    echo "XP2P_ENDPOINT_HEALTH_SETTINGS_CHANGED"
  loop: "{{ xp2p_client_endpoints | selectattr('state', 'equalto', 'present') | list }}"
  loop_control:
    label: "{{ item.source }} {{ item.tag }}"
  register: xp2p_client_endpoint_heartbeat_modes
  changed_when: "'XP2P_ENDPOINT_HEALTH_SETTINGS_CHANGED' in xp2p_client_endpoint_heartbeat_modes.stdout"
  no_log: true

- name: Wait for xp2p client endpoint config watcher to settle
  ansible.builtin.pause:
    seconds: "{{ xp2p_client_endpoints_settle_seconds }}"
  when: >-
    xp2p_client_endpoint_absent_remove is changed
    or xp2p_client_endpoint_additive_installs is changed
    or xp2p_client_endpoint_reinstalls is changed
    or xp2p_client_endpoint_heartbeat_modes is changed

- name: Reset XP2P client heartbeat capability cache
  ansible.builtin.raw: |
    set -eu
    state_path='{{ xp2p_client_endpoints_state_heartbeat_client_path }}'
    service_name='{{ xp2p_client_endpoints_service_name }}'
    if [ -x "/etc/init.d/${service_name}" ]; then
      "/etc/init.d/${service_name}" stop || true
    elif command -v systemctl >/dev/null 2>&1; then
      systemctl stop "${service_name}" || true
    fi
    if [ -f "$state_path" ]; then
      cp -a "$state_path" "${state_path}.before-capability-reset-$(date +%Y%m%dT%H%M%S)"
      rm -f "$state_path"
      echo "XP2P_HEARTBEAT_CAPABILITY_CACHE_RESET"
    fi
    if [ -x "/etc/init.d/${service_name}" ]; then
      "/etc/init.d/${service_name}" start
    elif command -v systemctl >/dev/null 2>&1; then
      systemctl start "${service_name}"
    fi
  register: xp2p_client_endpoint_heartbeat_cache_reset
  changed_when: "'XP2P_HEARTBEAT_CAPABILITY_CACHE_RESET' in xp2p_client_endpoint_heartbeat_cache_reset.stdout"
  when: xp2p_client_endpoints_reset_heartbeat_capability_cache | bool

- name: Wait for xp2p client heartbeat capability rediscovery
  ansible.builtin.pause:
    seconds: "{{ xp2p_client_endpoints_settle_seconds }}"
  when: xp2p_client_endpoint_heartbeat_cache_reset is changed

- name: Run XP2P client endpoint healthcheck after apply
  ansible.builtin.include_tasks: healthcheck.yml
