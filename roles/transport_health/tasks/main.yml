---
- name: Validate normalized transport health input
  ansible.builtin.assert:
    that:
      - transport_health_router_model is mapping
      - transport_health_router_model.transports is mapping
      - transport_health_candidates is sequence
      - transport_health_candidates | length > 0
      - transport_health_candidates | map(attribute='id') | list | length == transport_health_candidates | map(attribute='id') | list | unique | length
      - (transport_health_candidates | map(attribute='id') | list | last) == 'wan_direct'
    fail_msg: >-
      Transport health requires a non-empty unique ordered candidate chain ending
      in wan_direct on {{ inventory_hostname }}.

- name: Initialize normalized transport health candidate state
  ansible.builtin.set_fact:
    transport_health_candidate_results: []
    transport_health_selected_model: null
    transport_health_selected_status: dead
    transport_health_selected_failure_reason: no_candidate_healthy

- name: Evaluate transport candidates in declared order
  ansible.builtin.include_tasks: candidate.yml
  loop: "{{ transport_health_candidates }}"
  loop_control:
    loop_var: transport_health_candidate
    label: "{{ transport_health_candidate.id }}"

- name: Select the first healthy transport candidate
  ansible.builtin.set_fact:
    transport_health_first_healthy_id: >-
      {{
        transport_health_candidate_results
        | selectattr('status', 'equalto', 'healthy')
        | map(attribute='id')
        | list
        | first
        | default('', true)
      }}

- name: Resolve the selected transport candidate model
  ansible.builtin.set_fact:
    transport_health_selected_model: >-
      {{
        transport_health_candidates
        | selectattr('id', 'equalto', transport_health_first_healthy_id)
        | list
        | first
        | default({}, true)
      }}
    transport_health_selected_status: "{{ 'healthy' if transport_health_first_healthy_id else 'dead' }}"
    transport_health_selected_failure_reason: >-
      {{
        'none'
        if transport_health_first_healthy_id
        else (transport_health_candidate_results | map(attribute='failure_reason') | list | join('; '))
      }}

- name: Normalize selected transport health result
  ansible.builtin.set_fact:
    transport_health_status: "{{ transport_health_selected_status }}"
    transport_health_failure_reason: "{{ transport_health_selected_failure_reason }}"
    transport_health_model: "{{ transport_health_selected_model | default({}) }}"

- name: Report normalized transport health
  ansible.builtin.debug:
    msg:
      candidates: "{{ transport_health_candidates | map(attribute='id') | list }}"
      candidate_results: "{{ transport_health_candidate_results }}"
      selected_transport: "{{ transport_health_model.id | default('none') }}"
      status: "{{ transport_health_status }}"
      failure_reason: "{{ transport_health_failure_reason }}"

- name: Fail when no declared transport candidate is healthy
  ansible.builtin.assert:
    that:
      - transport_health_status == 'healthy'
    fail_msg: >-
      No transport candidate is healthy on {{ inventory_hostname }}.
      {{ transport_health_candidate_results }}
  when: transport_health_fail_on_dead | bool
