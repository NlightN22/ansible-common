---
- name: Validate selected Windows WireGuard member
  ansible.builtin.assert:
    that:
      - resolved_wireguard_network is defined
      - resolved_wireguard_network is mapping
      - resolved_wireguard_network.current_member is mapping
      - resolved_wireguard_network.current_member.active | default(true) | bool
      - resolved_wireguard_network.current_member.platform | default('') == 'windows'
      - resolved_wireguard_network.interface_name is defined
    fail_msg: >-
      Host {{ inventory_hostname }} is not an active Windows member of
      WireGuard network {{ network_id | default(resolved_wireguard_network.id | default('unknown')) }}.

- name: Select Windows WireGuard expected runtime contract
  ansible.builtin.set_fact:
    wireguard_windows_tunnel_name: "{{ resolved_wireguard_network.hub_member.windows_tunnel_name | default(resolved_wireguard_network.interface_name) }}"
    wireguard_windows_expected_peers: >-
      {%- set ns = namespace(peers=[]) -%}
      {%- for peer in resolved_wireguard_network | ansible_common.core.wireguard_expected_peers -%}
      {%- set ns.peers = ns.peers + [{
        'public_key': peer.public_key,
        'allowed_ips': peer.allowed_ips | default([])
      }] -%}
      {%- endfor -%}
      {{ ns.peers }}
    wireguard_windows_expected_route_targets: "{{ resolved_wireguard_network | ansible_common.core.wireguard_expected_route_targets }}"
    wireguard_windows_health_ping_addresses: "{{ resolved_wireguard_network | ansible_common.core.wireguard_expected_ping_targets }}"
    wireguard_windows_healthcheck_ping_source_address: >-
      {{
        resolved_wireguard_network.current_member.address
        | regex_replace('/.*$', '')
      }}
    wireguard_windows_endpoint_expected_interface: "{{ resolved_wireguard_network.effective_transport.interface | default('') }}"

- name: Check Windows WireGuard tunnel service and runtime
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $tunnelName = '{{ wireguard_windows_tunnel_name }}'
    $serviceName = 'WireGuardTunnel${{ wireguard_windows_tunnel_name }}'
    $expectedPeers = '{{ wireguard_windows_expected_peers | to_json }}' | ConvertFrom-Json
    $routeTargets = '{{ wireguard_windows_expected_route_targets | to_json }}' | ConvertFrom-Json
    $pingTargets = '{{ wireguard_windows_health_ping_addresses | to_json }}' | ConvertFrom-Json
    $pingSourceAddress = '{{ wireguard_windows_healthcheck_ping_source_address }}'
    $endpointHost = '{{ resolved_wireguard_network.endpoint.host | default("") }}'
    $endpointExpectedInterface = '{{ wireguard_windows_endpoint_expected_interface }}'
    $isHub = {{ (resolved_wireguard_network.is_hub | bool) | ternary('$true', '$false') }}
    if ($expectedPeers -isnot [array]) {
      $expectedPeers = @($expectedPeers)
    }
    if ($routeTargets -isnot [array]) {
      $routeTargets = @($routeTargets)
    }
    if ($pingTargets -isnot [array]) {
      $pingTargets = @($pingTargets)
    }
    function Get-RouteAddress {
      param([string]$Target)
      if ($Target.Contains('/')) {
        return $Target.Split('/')[0]
      }
      return $Target
    }
    function Resolve-IPv4Address {
      param([string]$Target)
      $parsedAddress = $null
      if ([System.Net.IPAddress]::TryParse($Target, [ref]$parsedAddress)) {
        if ($parsedAddress.AddressFamily -eq [System.Net.Sockets.AddressFamily]::InterNetwork) {
          return $parsedAddress.IPAddressToString
        }
      }
      $resolved = [System.Net.Dns]::GetHostAddresses($Target) |
        Where-Object { $_.AddressFamily -eq [System.Net.Sockets.AddressFamily]::InterNetwork } |
        Select-Object -First 1
      if (-not $resolved) {
        throw "Unable to resolve IPv4 address for $Target."
      }
      return $resolved.IPAddressToString
    }
    function Find-BestRoute {
      param([string]$Target)
      $address = Resolve-IPv4Address -Target (Get-RouteAddress -Target $Target)
      $route = Find-NetRoute -RemoteIPAddress $address -ErrorAction Stop |
        Sort-Object -Property RouteMetric, InterfaceMetric |
        Select-Object -First 1
      if (-not $route) {
        throw "No route found for $Target."
      }
      return $route
    }
    $wg = Get-Command wg.exe -ErrorAction SilentlyContinue
    if (-not $wg) {
      throw 'wg.exe is not available in PATH.'
    }
    $tunnelInterface = Get-NetIPInterface -InterfaceAlias $tunnelName -AddressFamily IPv4 -ErrorAction SilentlyContinue |
      Select-Object -First 1
    if (-not $tunnelInterface) {
      throw "WireGuard interface $tunnelName is missing from Windows routing table."
    }
    $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
    if (-not $service) {
      throw "WireGuard tunnel service $serviceName is missing."
    }
    if ($service.Status -ne 'Running') {
      throw "WireGuard tunnel service $serviceName is $($service.Status), expected Running."
    }
    $dump = & $wg.Source show $tunnelName dump
    if ($LASTEXITCODE -ne 0) {
      throw "wg show $tunnelName dump failed with exit code $LASTEXITCODE."
    }
    $dumpText = $dump -join "`n"
    foreach ($peer in $expectedPeers) {
      $publicKey = [string]$peer.public_key
      $allowedIps = @($peer.allowed_ips) -join ','
      $line = @($dump | Where-Object { $_.StartsWith("$publicKey`t") }) | Select-Object -First 1
      if (-not $line) {
        throw "WireGuard peer $publicKey is missing from $tunnelName."
      }
      if ($line -notlike "*`t$allowedIps`t*") {
        throw "WireGuard peer $publicKey has unexpected AllowedIPs. Expected $allowedIps."
      }
      {% if wireguard_windows_healthcheck_handshake_enabled | bool %}
      $fields = $line -split "`t"
      $latestHandshake = [int64]$fields[4]
      $now = [int64][DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
      if ($latestHandshake -le 0 -or ($now - $latestHandshake) -gt {{ wireguard_windows_healthcheck_handshake_max_age_seconds | int }}) {
        throw "WireGuard peer $publicKey latest handshake is stale."
      }
      {% endif %}
    }
    foreach ($target in $routeTargets) {
      $route = Find-BestRoute -Target ([string]$target)
      if ($route.InterfaceAlias -ne $tunnelName) {
        throw "WireGuard route to $target uses $($route.InterfaceAlias), expected $tunnelName."
      }
    }
    if (-not $isHub -and $endpointHost) {
      $endpointRoute = Find-BestRoute -Target $endpointHost
      if ($endpointRoute.InterfaceAlias -eq $tunnelName) {
        throw "WireGuard endpoint route to $endpointHost loops through $tunnelName."
      }
      if ($endpointExpectedInterface -and $endpointRoute.InterfaceAlias -ne $endpointExpectedInterface) {
        throw "WireGuard endpoint route to $endpointHost uses $($endpointRoute.InterfaceAlias), expected $endpointExpectedInterface."
      }
    }
    {% if wireguard_windows_healthcheck_reachability_enabled | bool %}
    foreach ($target in $pingTargets) {
      $pingOutput = & ping.exe -S $pingSourceAddress -n {{ wireguard_windows_healthcheck_ping_count | int }} ([string]$target)
      $replyCount = @($pingOutput | Where-Object { $_ -match '\bTTL=' }).Count
      if ($LASTEXITCODE -ne 0 -or $replyCount -ne {{ wireguard_windows_healthcheck_ping_count | int }}) {
        throw "WireGuard ping from $pingSourceAddress to $target failed. Replies: $replyCount."
      }
    }
    {% endif %}
    [PSCustomObject]@{
      TunnelName = $tunnelName
      ServiceName = $serviceName
      ServiceStatus = [string]$service.Status
      ExpectedPeerCount = $expectedPeers.Count
      RouteTargetCount = $routeTargets.Count
      PingTargetCount = $pingTargets.Count
    } | ConvertTo-Json -Compress
  register: windows_wireguard_health
  changed_when: false

- name: Show Windows WireGuard healthcheck summary
  ansible.builtin.debug:
    var: windows_wireguard_health.stdout
