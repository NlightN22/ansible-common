---
- name: Discover active Xray outbound from proxy routing rules for WireGuard transport health
  ansible.builtin.raw: >-
    jq -r --argjson candidates '{{ wireguard_transport_health_candidates | selectattr("type", "in", ["xp2p", "xp2p_xray"]) | map(attribute="dataplane.outbound_tag") | list | to_json }}' '[.rules[]?.outboundTag? as $tag | select($tag != null and ($candidates | index($tag)) != null) | $tag] | if length > 0 then .[0] else "" end' /etc/xp2p/config-client/routing.rules.after-xp2p-managed.json
  register: wireguard_transport_health_active_outbound
  changed_when: false
  failed_when: false

- name: Run normalized health for the WireGuard endpoint transport
  ansible.builtin.include_role:
    name: ansible_common.core.transport_health
  vars:
    transport_health_router_model: "{{ wireguard_transport_health_router_model }}"
    transport_health_candidates: "{{ wireguard_transport_health_candidates }}"
    transport_health_active_outbound_tag: "{{ wireguard_transport_health_active_outbound.stdout | trim }}"

- name: Publish normalized WireGuard transport health result
  ansible.builtin.set_fact:
    wireguard_transport_health_result:
      status: "{{ transport_health_status }}"
      model: "{{ transport_health_model }}"
      candidates: "{{ transport_health_candidate_results }}"
