---
- name: Select 3x-ui OpenWrt routing star
  ansible.builtin.set_fact:
    openwrt_xp2p_three_x_ui_routing_star: "{{ three_x_ui_star }}"

- name: Select 3x-ui OpenWrt routing client model
  ansible.builtin.set_fact:
    openwrt_xp2p_three_x_ui_routing_client: >-
      {{
        openwrt_xp2p_three_x_ui_routing_star.clients
        | selectattr('host', 'equalto', inventory_hostname)
        | first
      }}

- name: Load the canonical OpenWrt router transport model
  ansible.builtin.include_vars:
    file: "{{ inventory_env_dir }}/models/openwrt/{{ inventory_hostname }}.yml"
    name: openwrt_three_x_ui_router_document

- name: Build 3x-ui OpenWrt routing settings
  ansible.builtin.set_fact:
    openwrt_xp2p_three_x_ui_router_dataplane: >-
      {{ openwrt_three_x_ui_router_document.openwrt_router.dataplane | default({}) }}

- name: Build 3x-ui OpenWrt routing settings
  ansible.builtin.set_fact:
    openwrt_xp2p_three_x_ui_routing_defaults: >-
      {{
        openwrt_xp2p_three_x_ui_routing_star.openwrt_routing | default({})
        | combine({
            'remote_config_dir': openwrt_xp2p_three_x_ui_router_dataplane.xp2p.remote_config_dir,
            'remote_dat_dir': openwrt_xp2p_three_x_ui_router_dataplane.xp2p.remote_dat_dir,
            'routing_template': openwrt_xp2p_three_x_ui_router_dataplane.xp2p.routing_template,
            'socks_port': openwrt_xp2p_three_x_ui_router_dataplane.xp2p.socks_port,
            'intercept': openwrt_xp2p_three_x_ui_router_dataplane.intercept
          }, recursive=True)
      }}
    openwrt_xp2p_three_x_ui_routing_client_settings: "{{ openwrt_xp2p_three_x_ui_routing_client.openwrt_routing | default({}) }}"

- name: Initialize 3x-ui OpenWrt transport candidate definitions
  ansible.builtin.set_fact:
    openwrt_xp2p_three_x_ui_transport_candidate_inputs: >-
      {{
        [openwrt_three_x_ui_router_document.openwrt_router.transports.preferred]
        + openwrt_three_x_ui_router_document.openwrt_router.transports.fallbacks
      }}
    openwrt_xp2p_three_x_ui_transport_candidates: []

- name: Load 3x-ui OpenWrt transport definitions by ID
  ansible.builtin.include_vars:
    file: "{{ inventory_env_dir }}/models/transports/{{ item }}.yml"
    name: openwrt_xp2p_three_x_ui_transport_document
  loop: >-
    {{
      openwrt_xp2p_three_x_ui_transport_candidate_inputs
      | select('string')
      | unique
      | list
    }}
  register: openwrt_xp2p_three_x_ui_transport_definition_loads

- name: Normalize 3x-ui OpenWrt transport candidate definitions
  ansible.builtin.set_fact:
    openwrt_xp2p_three_x_ui_transport_candidates: []

- name: Publish normalized 3x-ui OpenWrt transport candidate
  ansible.builtin.set_fact:
    openwrt_xp2p_three_x_ui_transport_candidates: >-
      {{
        openwrt_xp2p_three_x_ui_transport_candidates
        + [
            item.ansible_facts.openwrt_xp2p_three_x_ui_transport_document.transport
            | combine({
                'outbound_tag': (
                  item.ansible_facts.openwrt_xp2p_three_x_ui_transport_document.transport.dataplane.outbound_tag
                  | default('')
                ),
                'expected_public_ip': (
                  item.ansible_facts.openwrt_xp2p_three_x_ui_transport_document.transport.probes
                  | selectattr('type', 'equalto', 'socks_http')
                  | map(attribute='expected_public_ip')
                  | select('defined')
                  | first
                  | default('')
                )
              }, recursive=True)
          ]
      }}
  loop: "{{ openwrt_xp2p_three_x_ui_transport_definition_loads.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Initialize canonical transport egress check intents
  ansible.builtin.set_fact:
    openwrt_xp2p_three_x_ui_transport_egress_checks: []

- name: Build canonical transport egress check intents
  ansible.builtin.set_fact:
    openwrt_xp2p_three_x_ui_transport_egress_checks: >-
      {{
        openwrt_xp2p_three_x_ui_transport_egress_checks
        + [{
            'name': item.id,
            'url': item.url,
            'expected_public_ip': item.expected_public_ip,
            'destination_ipv4': item.destination_ipv4 | default([])
          }]
      }}
  loop: >-
    {{
      (
        openwrt_xp2p_three_x_ui_transport_candidates | first
      ).probes | default([])
      | selectattr('type', 'equalto', 'socks_http')
      | list
    }}
  loop_control:
    label: "{{ item.id }}"

- name: Initialize transport probe route intents
  ansible.builtin.set_fact:
    openwrt_xp2p_three_x_ui_transport_probe_routes: []

- name: Build transport probe route intents from transport definitions
  ansible.builtin.set_fact:
    openwrt_xp2p_three_x_ui_transport_probe_routes: >-
      {{
        openwrt_xp2p_three_x_ui_transport_probe_routes
        + [{
            'service': 'transport_probe_' ~ item.0.id ~ '_' ~ item.1.id,
            'ipv4_cidrs': item.1.destination_ipv4,
            'outbound_tag': (
              openwrt_xp2p_three_x_ui_transport_candidates | first
            ).dataplane.outbound_tag
          }]
      }}
  loop: >-
    {{ query(
         'subelements',
         openwrt_xp2p_three_x_ui_transport_candidates,
         'probes',
         {'skip_missing': True}
       ) }}
  loop_control:
    label: "{{ item.0.id }}/{{ item.1.id }}"
  when:
    - item.1.type | default('') == 'socks_http'
    - item.1.destination_ipv4 is defined

- name: Build effective 3x-ui OpenWrt routing settings
  ansible.builtin.set_fact:
    openwrt_xp2p_three_x_ui_routing: >-
      {{
        openwrt_xp2p_three_x_ui_routing_defaults
        | combine(openwrt_xp2p_three_x_ui_routing_client_settings, recursive=True)
        | combine({
            'transport_candidates': openwrt_xp2p_three_x_ui_transport_candidates,
            'proxy_outbound_tag': (
              openwrt_xp2p_three_x_ui_transport_candidates | first
            ).dataplane.outbound_tag | default(''),
            'proxy_route_outbound_tag': (
              openwrt_xp2p_three_x_ui_transport_candidates | first
            ).dataplane.outbound_tag | default(''),
            'final_outbound_tag': (
              openwrt_xp2p_three_x_ui_transport_candidates | first
            ).dataplane.outbound_tag | default(''),
            'socks_port': (
              openwrt_xp2p_three_x_ui_transport_candidates | first
            ).dataplane.socks_port | default(0)
            , 'socks_egress_checks': openwrt_xp2p_three_x_ui_transport_egress_checks
          }, recursive=True)
      }}

- name: Build 3x-ui OpenWrt required access context
  ansible.builtin.set_fact:
    openwrt_xp2p_three_x_ui_proxy_route_outbound_tag: >-
      {{
        openwrt_xp2p_three_x_ui_routing.proxy_route_outbound_tag
        | default(openwrt_xp2p_three_x_ui_routing.proxy_outbound_tag | default(''))
      }}
    openwrt_xp2p_three_x_ui_required_access_layers: "{{ openwrt_xp2p_three_x_ui_routing.required_access.layers | default([]) }}"
    openwrt_xp2p_three_x_ui_intercept_failover_socks_probes: >-
      {{
        (
          openwrt_xp2p_three_x_ui_transport_candidates | first
        ).probes | default([])
        | selectattr('type', 'equalto', 'socks_http')
        | list
      }}
    openwrt_xp2p_three_x_ui_intercept_failover_required_probe_successes: >-
      {{
        (
          openwrt_xp2p_three_x_ui_transport_candidates | first
        ).probe_policy.required_successes
        | default(openwrt_xp2p_three_x_ui_routing.intercept.failover.required_probe_successes | default(0))
      }}
    openwrt_xp2p_three_x_ui_transport_candidates: >-
      {{ openwrt_xp2p_three_x_ui_routing.transport_candidates | default([]) }}
    openwrt_transport_candidates: >-
      {{ openwrt_xp2p_three_x_ui_routing.transport_candidates | default([]) }}

- name: Build 3x-ui OpenWrt required access proxy route list
  ansible.builtin.set_fact:
    openwrt_xp2p_three_x_ui_required_access_proxy_routes: >-
      {{
        internet_access_policy
        | default({'layers': []})
        | ansible_common.core.internet_access_policy_proxy_routes(
            openwrt_xp2p_three_x_ui_required_access_layers,
            openwrt_xp2p_three_x_ui_proxy_route_outbound_tag
          )
      }}

- name: Build 3x-ui OpenWrt proxy route safety context
  ansible.builtin.set_fact:
    openwrt_xp2p_three_x_ui_endpoint_hostnames: >-
      {{
        (
          [
            openwrt_xp2p_three_x_ui_routing_star.hub_host | default(''),
            openwrt_xp2p_three_x_ui_routing_star.endpoint.host | default(''),
            openwrt_xp2p_three_x_ui_routing_star.endpoint.sni | default('')
          ]
          + (openwrt_xp2p_three_x_ui_routing.tunnel_endpoint_hostnames | default([]))
        )
        | map('lower')
        | reject('equalto', '')
        | unique
        | list
      }}
    openwrt_xp2p_three_x_ui_endpoint_public_ips: >-
      {{
        openwrt_xp2p_three_x_ui_routing.tunnel_endpoint_public_ips
        | default([])
        | map('string')
        | reject('equalto', '')
        | unique
        | list
      }}

- name: Build 3x-ui OpenWrt proxy route list
  ansible.builtin.set_fact:
    openwrt_xp2p_three_x_ui_proxy_routes: >-
      {{
        openwrt_xp2p_three_x_ui_transport_probe_routes
        + (openwrt_xp2p_three_x_ui_routing.proxy_routes | default([]))
        + openwrt_xp2p_three_x_ui_required_access_proxy_routes
      }}
    openwrt_xp2p_three_x_ui_xray_direct_cidrs: >-
      {{ openwrt_xp2p_three_x_ui_routing.xray_direct_cidrs | default([]) }}

- name: Validate 3x-ui OpenWrt routing model
  ansible.builtin.assert:
    that:
      - inventory_hostname in openwrt_xp2p_three_x_ui_routing_star.clients | map(attribute='host') | list
      - openwrt_xp2p_three_x_ui_routing.enabled | default(false) | bool
      - openwrt_xp2p_three_x_ui_routing.proxy_outbound_tag | default('') | length > 0
      - openwrt_xp2p_three_x_ui_routing.final_outbound_tag == openwrt_xp2p_three_x_ui_routing.proxy_outbound_tag
      - openwrt_xp2p_three_x_ui_routing.routing_template | default('') | length > 0
      - openwrt_xp2p_three_x_ui_routing.remote_config_dir | default('') | length > 0
      - openwrt_xp2p_three_x_ui_routing.remote_dat_dir | default('') | length > 0
      - openwrt_xp2p_three_x_ui_routing.dat_files | default([]) | length > 0
      - openwrt_xp2p_three_x_ui_routing.socks_port | default(0) | int > 0
      - openwrt_xp2p_three_x_ui_routing.socks_egress_checks | default([]) | length > 0
      - openwrt_xp2p_three_x_ui_transport_candidates | length >= 2
      - >-
        openwrt_xp2p_three_x_ui_transport_candidate_inputs
        == [openwrt_three_x_ui_router_document.openwrt_router.transports.preferred]
          + openwrt_three_x_ui_router_document.openwrt_router.transports.fallbacks
      - openwrt_xp2p_three_x_ui_transport_candidates | map(attribute='id') | list | last == 'wan_direct'
      - >-
        openwrt_xp2p_three_x_ui_transport_candidates
        | map(attribute='id')
        | list
        == openwrt_xp2p_three_x_ui_transport_candidate_inputs
        | map('string')
        | list
      - openwrt_xp2p_three_x_ui_transport_candidates | map(attribute='outbound_tag', default='') | list | select('equalto', '') | list | length == 1
      - openwrt_xp2p_three_x_ui_transport_candidates | map(attribute='expected_public_ip', default='') | list | select('equalto', '') | list | length == 1
      - >-
        openwrt_xp2p_three_x_ui_routing.mandatory_proxy_routes is not defined
      - >-
        openwrt_xp2p_three_x_ui_routing.mandatory_proxy_outbound_tag is not defined
      - >-
        openwrt_xp2p_three_x_ui_routing.komponent_proxy_routes is not defined
      - >-
        openwrt_xp2p_three_x_ui_routing.zamena_proxy_routes is not defined
      - >-
        openwrt_xp2p_three_x_ui_required_access_layers | length == 0
        or internet_access_policy is defined
      - >-
        openwrt_xp2p_three_x_ui_proxy_routes | length == 0
        or openwrt_xp2p_three_x_ui_proxy_route_outbound_tag | length > 0
      - >-
        openwrt_xp2p_three_x_ui_proxy_routes
        | selectattr('service', 'defined')
        | list
        | length == openwrt_xp2p_three_x_ui_proxy_routes | length
      - >-
        openwrt_xp2p_three_x_ui_proxy_routes
        | map('ansible_common.core.internet_access_policy_routing_route_ready')
        | select('equalto', true)
        | list
        | length == openwrt_xp2p_three_x_ui_proxy_routes | length
      - >-
        openwrt_xp2p_three_x_ui_xray_direct_cidrs
        | select('match', '^[0-9.]+/[0-9]+$')
        | list
        | length == openwrt_xp2p_three_x_ui_xray_direct_cidrs | length
      - >-
        openwrt_xp2p_three_x_ui_proxy_routes
        | selectattr('outbound_tag', 'defined')
        | list
        | length == openwrt_xp2p_three_x_ui_proxy_routes | length
      - >-
        openwrt_xp2p_three_x_ui_proxy_routes
        | selectattr('outbound_tag', 'defined')
        | map(attribute='outbound_tag')
        | unique
        | list
        | difference([openwrt_xp2p_three_x_ui_proxy_route_outbound_tag])
        | length == 0
      - >-
        openwrt_xp2p_three_x_ui_proxy_routes
        | map(attribute='fqdn', default='')
        | map('lower')
        | reject('equalto', '')
        | list
        | intersect(openwrt_xp2p_three_x_ui_endpoint_hostnames)
        | length == 0
      - >-
        openwrt_xp2p_three_x_ui_proxy_routes
        | map(attribute='expected_ipv4', default='')
        | map('string')
        | reject('equalto', '')
        | list
        | intersect(openwrt_xp2p_three_x_ui_endpoint_public_ips)
        | length == 0
      - >-
        openwrt_xp2p_three_x_ui_routing.socks_egress_checks
        | selectattr('url', 'defined')
        | list
        | length == openwrt_xp2p_three_x_ui_routing.socks_egress_checks | length
      - >-
        openwrt_xp2p_three_x_ui_routing.socks_egress_checks
        | selectattr('expected_public_ip', 'defined')
        | list
        | length
        +
        openwrt_xp2p_three_x_ui_routing.socks_egress_checks
        | selectattr('expected_public_ip_host', 'defined')
        | list
        | length
        +
        openwrt_xp2p_three_x_ui_routing.socks_egress_checks
        | selectattr('expected_country', 'defined')
        | list
        | length
        == openwrt_xp2p_three_x_ui_routing.socks_egress_checks | length
    fail_msg: "The 3x-ui OpenWrt routing model is incomplete for {{ inventory_hostname }}."
