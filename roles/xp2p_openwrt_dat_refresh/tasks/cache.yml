---
- name: Validate XP2P dat refresh cache model
  ansible.builtin.assert:
    that:
      - xp2p_dat_refresh_model.id | default('') | length > 0
      - xp2p_dat_refresh_model.remote_dat_dir | default('') | length > 0
      - xp2p_dat_refresh_model.dat_files | default([]) | length > 0
      - xp2p_dat_refresh_model.dat_files | selectattr('checksum_url', 'defined') | list | length == xp2p_dat_refresh_model.dat_files | length
    fail_msg: "XP2P dat refresh model must define id, remote_dat_dir, dat_files, and a checksum_url for every file."
    quiet: true

- name: Ensure local XP2P dat cache exists
  ansible.builtin.file:
    path: "{{ xp2p_dat_refresh_cache_dir }}/{{ xp2p_dat_refresh_model.id }}"
    state: directory
    mode: "0755"

- name: Download and verify upstream XP2P dat files against GitHub SHA-256 sidecars
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ xp2p_dat_refresh_cache_dir }}/{{ xp2p_dat_refresh_model.id }}/{{ item.name }}"
    checksum: "sha256:{{ item.checksum_url }}"
    mode: "0644"
    timeout: 60
    force: "{{ xp2p_dat_refresh_force | bool }}"
  loop: "{{ xp2p_dat_refresh_model.dat_files }}"
  loop_control:
    label: "{{ item.name }}"
  register: xp2p_dat_refresh_upstream_download
  retries: 4
  delay: 2
  until: xp2p_dat_refresh_upstream_download is succeeded

- name: Validate local XP2P dat files
  ansible.builtin.stat:
    path: "{{ xp2p_dat_refresh_cache_dir }}/{{ xp2p_dat_refresh_model.id }}/{{ item.name }}"
    get_checksum: false
    get_mime: false
  register: xp2p_dat_refresh_local_dat
  loop: "{{ xp2p_dat_refresh_model.dat_files }}"
  loop_control:
    label: "{{ item.name }}"

- name: Require non-empty local XP2P dat files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.size | int > 0
    fail_msg: "Local XP2P dat file {{ item.item.name }} is missing or empty."
    quiet: true
  loop: "{{ xp2p_dat_refresh_local_dat.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
