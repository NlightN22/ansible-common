---
xp2p_client_endpoints_operation: healthcheck
xp2p_client_endpoints: "{{ resolved_xp2p_client_endpoints | default([]) }}"
xp2p_client_endpoints_config_path: /etc/xp2p/xp2p-client.toml
xp2p_client_endpoints_reset_heartbeat_capability_cache: false
xp2p_client_endpoints_state_heartbeat_client_path: /etc/xp2p/state-heartbeat-client.json
xp2p_client_endpoints_service_name: xp2p-client
xp2p_client_endpoints_settle_seconds: 15
