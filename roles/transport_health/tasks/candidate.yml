---
- name: Run transport health adapter
  ansible.builtin.raw: |
    set -u
    transport_id='{{ transport_health_candidate.id }}'
    transport_type='{{ transport_health_candidate.type }}'
    transport_status=dead
    failure_reason=none

    fetch_url() {
      request_url="$1"
      if command -v curl >/dev/null 2>&1; then
        curl -fsS --connect-timeout 8 --max-time 30 "$request_url"
      elif command -v wget >/dev/null 2>&1; then
        wget -T 30 -qO- "$request_url"
      else
        return 127
      fi
    }

    fetch_socks_url() {
      request_url="$1"
      socks_port="$2"
      destination_ipv4="$3"
      if command -v curl >/dev/null 2>&1; then
        resolve_args=''
        if [ -n "$destination_ipv4" ]; then
          authority="${request_url#*://}"
          authority="${authority%%/*}"
          request_host="${authority%%:*}"
          request_port="${authority##*:}"
          [ "$request_port" = "$request_host" ] && request_port=443
          resolve_args="--resolve ${request_host}:${request_port}:${destination_ipv4}"
        fi
        # shellcheck disable=SC2086
        curl -fsS --socks5-hostname "127.0.0.1:${socks_port}" $resolve_args --connect-timeout 8 --max-time 30 "$request_url"
      else
        return 127
      fi
    }

    fetch_wan_url() {
      request_url="$1"
      wan_interface="$2"
      destination_ipv4="$3"
      if command -v curl >/dev/null 2>&1; then
        resolve_args=''
        if [ -n "$destination_ipv4" ]; then
          authority="${request_url#*://}"
          authority="${authority%%/*}"
          request_host="${authority%%:*}"
          request_port="${authority##*:}"
          [ "$request_port" = "$request_host" ] && request_port=443
          resolve_args="--resolve ${request_host}:${request_port}:${destination_ipv4}"
        fi
        # shellcheck disable=SC2086
        curl --interface "$wan_interface" -fsS $resolve_args --connect-timeout 8 --max-time 30 "$request_url"
      else
        return 127
      fi
    }

    check_egress_probe() {
      probe_kind="$1"
      probe_url="$2"
      expected_ip="$3"
      destination_ipv4="$4"
      expected_country="$5"
      if [ "$probe_kind" = socks_http ]; then
        probe_output="$(fetch_socks_url "$probe_url" '{{ transport_health_candidate.dataplane.socks_port | default(51180) }}' "$destination_ipv4" || true)"
      else
        probe_output="$(fetch_url "$probe_url" || true)"
      fi
      actual_ip="$(printf '%s\n' "$probe_output" | grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -1 || true)"
      if [ -z "$actual_ip" ]; then
        failure_reason="probe_${probe_kind}_empty"
        return 1
      fi
      if [ -n "$expected_ip" ] && [ "$actual_ip" != "$expected_ip" ]; then
        failure_reason="probe_${probe_kind}_expected_${expected_ip}_got_${actual_ip}"
        return 1
      fi
      if [ -n "$expected_country" ] && ! printf '%s\n' "$probe_output" | grep -Eiq '"country"[[:space:]]*:[[:space:]]*"?'"$expected_country"'"?|country[=:][[:space:]]*'"$expected_country"; then
        failure_reason="probe_${probe_kind}_expected_country_${expected_country}"
        return 1
      fi
      return 0
    }

    case "$transport_type" in
      xp2p|xp2p_xray)
        interface='{{ transport_health_candidate.dataplane.interface | default('') }}'
        outbound_tag='{{ transport_health_candidate.dataplane.outbound_tag | default('') }}'
        active_outbound_tag='{{ transport_health_active_outbound_tag | default('') }}'
        if ! ip link show "$interface" >/dev/null 2>&1; then
          failure_reason="interface_missing_${interface}"
        elif [ '{{ transport_health_candidate.dataplane.independent_egress_probe | default(false) | lower }}' = false ] &&
             [ "$active_outbound_tag" != "$outbound_tag" ]; then
          transport_status=unverified
          failure_reason=shared_socks_probe_not_independent
        elif ! command -v curl >/dev/null 2>&1; then
          failure_reason=required_curl_missing_for_socks_probe
        else
          probe_successes=0
          probe_count=0
          {% for probe in transport_health_candidate.probes | default([]) %}
          if check_egress_probe '{{ probe.type }}' '{{ probe.url | default('') }}' '{{ probe.expected_public_ip | default('') }}' '{{ probe.destination_ipv4 | default([]) | first | default('') }}' '{{ probe.expected_country | default('') }}'; then
            probe_successes=$((probe_successes + 1))
          fi
          probe_count=$((probe_count + 1))
          {% endfor %}
          required_probe_successes='{{ transport_health_candidate.probe_policy.required_successes | default(1) | int }}'
          if [ "$probe_successes" -ge "$required_probe_successes" ]; then
            transport_status=healthy
            failure_reason=none
          else
            failure_reason="probe_quorum_${probe_successes}_${required_probe_successes}"
          fi
        fi
        ;;
      wan_direct)
        wan_interface='{{ (transport_health_router_model.uplinks | selectattr("active", "equalto", true) | sort(attribute="priority") | map(attribute="interface") | first) | default("") }}'
        probe_successes=0
        probe_count=0
        required_probe_successes='{{ transport_health_candidate.probe_policy.required_successes | default(1) | int }}'
        if [ -z "$wan_interface" ]; then
          failure_reason=active_wan_interface_missing
        fi
        {% for probe in transport_health_candidate.probes | default([]) %}
        if [ "$failure_reason" = none ]; then
          probe_output="$(fetch_wan_url '{{ probe.url | default('') }}' "$wan_interface" '{{ probe.destination_ipv4 | default([]) | first | default('') }}' || true)"
          actual_ip="$(printf '%s\n' "$probe_output" | grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -1 || true)"
          probe_ok=true
          if [ -z "$actual_ip" ]; then
            probe_ok=false
            failure_reason="probe_{{ probe.type }}_empty"
          elif [ -n '{{ probe.expected_public_ip | default('') }}' ] && [ "$actual_ip" != '{{ probe.expected_public_ip | default('') }}' ]; then
            probe_ok=false
            failure_reason="probe_{{ probe.type }}_expected_{{ probe.expected_public_ip | default('') }}_got_${actual_ip}"
          elif [ -n '{{ probe.expected_country | default('') }}' ] && ! printf '%s\n' "$probe_output" | grep -Eiq '"country"[[:space:]]*:[[:space:]]*"?'"{{ probe.expected_country | default('') }}"'"?|country[=:][[:space:]]*'"{{ probe.expected_country | default('') }}"; then
            probe_ok=false
            failure_reason="probe_{{ probe.type }}_expected_country_{{ probe.expected_country | default('') }}"
          fi
          if [ "$probe_ok" = true ]; then
            probe_successes=$((probe_successes + 1))
          fi
          probe_count=$((probe_count + 1))
        fi
        {% endfor %}
        if [ "$probe_successes" -ge "$required_probe_successes" ]; then
          transport_status=healthy
          failure_reason=none
        elif [ "$failure_reason" = none ]; then
          failure_reason="probe_quorum_${probe_successes}_${required_probe_successes}"
        fi
        ;;
      wireguard)
        interface='{{ transport_health_candidate.dataplane.interface | default('') }}'
        endpoint='{{ transport_health_candidate.endpoint.host | default('') }}'
        peer_public_key='{{ transport_health_candidate.endpoint.peer_public_key | default('') }}'
        max_age='{{ transport_health_candidate.dataplane.handshake_max_age_seconds | default(180) | int }}'
        if ! ip link show "$interface" >/dev/null 2>&1; then
          failure_reason="interface_missing_${interface}"
        elif ! ip route get "$endpoint" >/dev/null 2>&1; then
          failure_reason="endpoint_route_missing_${endpoint}"
        elif ! command -v wg >/dev/null 2>&1; then
          failure_reason=wireguard_command_missing
        elif [ -z "$peer_public_key" ]; then
          failure_reason=wireguard_peer_public_key_missing
        else
          now="$(date +%s)"
          handshake="$(wg show "$interface" latest-handshakes "$peer_public_key" 2>/dev/null | awk 'NF {print $2; exit}' || true)"
          if [ -n "$handshake" ] && [ "$handshake" -gt 0 ] && [ "$((now - handshake))" -le "$max_age" ]; then
            transport_status=healthy
          else
            failure_reason=wireguard_handshake_stale
          fi
        fi
        ;;
    esac
    echo "TRANSPORT_ID=${transport_id}"
    echo "TRANSPORT_TYPE=${transport_type}"
    echo "TRANSPORT_STATUS=${transport_status}"
    echo "TRANSPORT_FAILURE_REASON=${failure_reason}"
    [ "$transport_status" = healthy ] || exit 1
  register: transport_health_candidate_adapter_result
  changed_when: false
  failed_when: false

- name: Record transport candidate result
  ansible.builtin.set_fact:
    transport_health_candidate_results: >-
      {{
        transport_health_candidate_results + [{
          'id': transport_health_candidate.id,
          'status': (
            transport_health_candidate_adapter_result.stdout
            | regex_findall('TRANSPORT_STATUS=([^\n]+)')
            | first
            | default('dead', true)
            | trim
          ),
          'failure_reason': transport_health_candidate_adapter_result.stdout
            | regex_findall('TRANSPORT_FAILURE_REASON=([^\n]+)')
            | first
            | default('adapter_failed', true)
            | trim
        }]
      }}
