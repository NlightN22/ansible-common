---
- name: Validate XP2P dat refresh sync model
  ansible.builtin.assert:
    that:
      - xp2p_dat_refresh_model.id | default('') | length > 0
      - xp2p_dat_refresh_model.remote_dat_dir | default('') | length > 0
      - xp2p_dat_refresh_model.dat_files | default([]) | length > 0
      - xp2p_dat_refresh_model.dat_files | selectattr('checksum_url', 'defined') | list | length == xp2p_dat_refresh_model.dat_files | length
    fail_msg: "XP2P dat refresh model must define id, remote_dat_dir, and dat_files."
    quiet: true

- name: Collect local XP2P dat file state
  ansible.builtin.stat:
    path: "{{ xp2p_dat_refresh_cache_dir }}/{{ xp2p_dat_refresh_model.id }}/{{ item.name }}"
    checksum_algorithm: sha256
    get_checksum: true
    get_mime: false
  register: xp2p_dat_refresh_local_dat_sync
  loop: "{{ xp2p_dat_refresh_model.dat_files }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  run_once: true

- name: Require non-empty cached XP2P dat files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.size | int > 0
    fail_msg: "Cached XP2P dat file {{ item.item.name }} is missing or empty."
    quiet: true
  loop: "{{ xp2p_dat_refresh_local_dat_sync.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  run_once: true

- name: Ensure remote XP2P dat directory exists
  ansible.builtin.raw: "mkdir -p '{{ xp2p_dat_refresh_model.remote_dat_dir }}'"
  changed_when: false

- name: Collect remote XP2P dat file state
  ansible.builtin.raw: |
    file='{{ xp2p_dat_refresh_model.remote_dat_dir }}/{{ item.name }}'
    if [ -s "$file" ]; then
      size="$(wc -c < "$file" | tr -d ' ')"
      checksum="$(sha256sum "$file" 2>/dev/null | awk '{print $1}')"
      printf '%s %s\n' "$size" "$checksum"
    fi
  register: xp2p_dat_refresh_remote_dat_sync
  changed_when: false
  loop: "{{ xp2p_dat_refresh_model.dat_files }}"
  loop_control:
    label: "{{ item.name }}"

- name: Transfer changed XP2P dat files to router staging path
  ansible.builtin.shell: |
    set -eu
    local_file={{ (xp2p_dat_refresh_cache_dir ~ '/' ~ xp2p_dat_refresh_model.id ~ '/' ~ item.name) | quote }}
    remote_file={{ (xp2p_dat_refresh_model.remote_dat_dir ~ '/.' ~ item.name ~ '.ansible-staging') | quote }}
    remote_target={{ ((ansible_user | default('root')) ~ '@' ~ (ansible_host | default(inventory_hostname))) | quote }}
    timeout {{ xp2p_dat_refresh_transfer_timeout_seconds | int }} scp \
      {% for arg in xp2p_dat_refresh_scp_extra_args %}{{ arg | quote }} {% endfor %}\
      {% if ansible_ssh_private_key_file | default('') | length > 0 %}-i {{ ansible_ssh_private_key_file | quote }} {% endif %}\
      -P {{ ansible_port | default(22) | quote }} \
      "$local_file" "$remote_target:$remote_file"
  loop: "{{ xp2p_dat_refresh_model.dat_files }}"
  loop_control:
    index_var: xp2p_dat_refresh_dat_index
    label: "{{ item.name }}"
  vars:
    xp2p_dat_refresh_remote_parts: "{{ xp2p_dat_refresh_remote_dat_sync.results[xp2p_dat_refresh_dat_index].stdout.split() }}"
    xp2p_dat_refresh_local_stat: "{{ xp2p_dat_refresh_local_dat_sync.results[xp2p_dat_refresh_dat_index].stat }}"
  delegate_to: localhost
  when: >-
    not (xp2p_dat_refresh_skip_sync | default(false) | bool)
    and (
      xp2p_dat_refresh_force | bool
      or (xp2p_dat_refresh_remote_parts | length) < 2
      or (xp2p_dat_refresh_remote_parts[0] | int) <= 0
      or (xp2p_dat_refresh_remote_parts[0] | int) != (xp2p_dat_refresh_local_stat.size | int)
      or xp2p_dat_refresh_remote_parts[1] != xp2p_dat_refresh_local_stat.checksum
    )

- name: Verify staged XP2P dat SHA-256 on router and atomically promote file
  ansible.builtin.raw: |
    set -eu
    staged='{{ xp2p_dat_refresh_model.remote_dat_dir }}/.{{ item.name }}.ansible-staging'
    final='{{ xp2p_dat_refresh_model.remote_dat_dir }}/{{ item.name }}'
    expected='{{ xp2p_dat_refresh_local_stat.checksum }}'
    expected_size='{{ xp2p_dat_refresh_local_stat.size | int }}'
    test "$(wc -c < "$staged" | tr -d ' ')" = "$expected_size"
    printf '%s  %s\n' "$expected" "$staged" | sha256sum -c -
    mv -f "$staged" "$final"
    test "$(wc -c < "$final" | tr -d ' ')" = "$expected_size"
    printf '%s  %s\n' "$expected" "$final" | sha256sum -c -
  loop: "{{ xp2p_dat_refresh_model.dat_files }}"
  loop_control:
    index_var: xp2p_dat_refresh_dat_index
    label: "{{ item.name }}"
  vars:
    xp2p_dat_refresh_remote_parts: "{{ xp2p_dat_refresh_remote_dat_sync.results[xp2p_dat_refresh_dat_index].stdout.split() }}"
    xp2p_dat_refresh_local_stat: "{{ xp2p_dat_refresh_local_dat_sync.results[xp2p_dat_refresh_dat_index].stat }}"
  register: xp2p_dat_refresh_verified_updates
  changed_when: true
  when: >-
    not (xp2p_dat_refresh_skip_sync | default(false) | bool)
    and (
      xp2p_dat_refresh_force | bool
      or (xp2p_dat_refresh_remote_parts | length) < 2
      or (xp2p_dat_refresh_remote_parts[0] | int) <= 0
      or (xp2p_dat_refresh_remote_parts[0] | int) != (xp2p_dat_refresh_local_stat.size | int)
      or xp2p_dat_refresh_remote_parts[1] != xp2p_dat_refresh_local_stat.checksum
    )

- name: Remove leftover XP2P dat staging files
  ansible.builtin.raw: >-
    rm -f '{{ xp2p_dat_refresh_model.remote_dat_dir }}/.{{ item.name }}.ansible-staging'
  changed_when: false
  loop: "{{ xp2p_dat_refresh_model.dat_files }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (xp2p_dat_refresh_skip_sync | default(false) | bool)

- name: Restart XP2P client after verified dat files changed
  ansible.builtin.raw: "xp2p client service restart"
  when:
    - xp2p_dat_refresh_restart_service | bool
    - >-
      xp2p_dat_refresh_verified_updates.results | default([])
      | selectattr('changed', 'defined')
      | selectattr('changed', 'equalto', true)
      | list | length > 0

- name: Refresh remote XP2P dat mtime when content is current
  ansible.builtin.raw: |
    file='{{ xp2p_dat_refresh_model.remote_dat_dir }}/{{ item.name }}'
    if [ -s "$file" ] && find "$file" -type f -mtime '+{{ xp2p_dat_refresh_model.dat_max_age_days | default(xp2p_dat_refresh_max_age_days) | int }}' -print | grep -F "$file" >/dev/null; then
      touch "$file"
      echo "$file"
    fi
  register: xp2p_dat_refresh_remote_mtime_sync
  changed_when: xp2p_dat_refresh_remote_mtime_sync.stdout | trim | length > 0
  loop: "{{ xp2p_dat_refresh_model.dat_files }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate remote XP2P dat files
  ansible.builtin.raw: "test -s '{{ xp2p_dat_refresh_model.remote_dat_dir }}/{{ item.name }}'"
  changed_when: false
  loop: "{{ xp2p_dat_refresh_model.dat_files }}"
  loop_control:
    label: "{{ item.name }}"
